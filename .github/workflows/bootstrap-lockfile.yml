name: bootstrap-npm-lockfile
on:
  push:
    branches:
      - chore/p3-reproducible-build
    paths:
      - .github/workflows/bootstrap-lockfile.yml
      - package.json
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate and report package-lock
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8")); if(lock.lockfileVersion!==3||!lock.packages?.[""]||!lock.packages?.["node_modules/next"]) process.exit(3);'
          printf '%s\n' 'ORBI_LOCK_JSON_BEGIN'
          cat package-lock.json
          printf '%s\n' 'ORBI_LOCK_JSON_END'
