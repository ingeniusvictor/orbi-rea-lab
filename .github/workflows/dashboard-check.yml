name: dashboard-static-check
on:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'scripts/verify-static-export.mjs'
      - '.github/workflows/dashboard-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'scripts/verify-static-export.mjs'
      - '.github/workflows/dashboard-check.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all Node tests
        run: npm test
      - name: Validate static Next.js build
        run: npm run build
      - name: Verify static routes and that no Evidence IDs ship
        run: node scripts/verify-static-export.mjs
